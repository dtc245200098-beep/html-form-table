<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        table {
            width: 100%;
            max-width: 600px;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề h1 theo yêu cầu -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng danh sách sản phẩm -->
    <table>
        <!-- Hàng tiêu đề của bảng -->
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        
        <!-- Sản phẩm 1 -->
        <tr>
            <td>Điện thoại iPhone 15</td>
            <td>22.990.000 VNĐ</td>
            <td>10</td>
        </tr>
        
        <!-- Sản phẩm 2 -->
        <tr>
            <td>Laptop Dell XPS 13</td>
            <td>35.500.000 VNĐ</td>
            <td>5</td>
        </tr>
        
        <!-- Sản phẩm 3 -->
        <tr>
            <td>Tai nghe Apple AirPods Pro 2</td>
            <td>5.990.000 VNĐ</td>
            <td>15</td>
        </tr>
        
        <!-- Sản phẩm 4 -->
        <tr>
            <td>Đồng hồ Apple Watch Series 9</td>
            <td>10.490.000 VNĐ</td>
            <td>8</td>
        </tr>
    </table>

</body>
</html>
