<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần 1: Form Sở Thích</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .form-container {
            width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input[type="text"], 
        .form-group input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .checkbox-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-group input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit {
            background-color: #4CAF50;
            color: white;
        }
        .btn-reset {
            background-color: #f44336;
            color: white;
        }
        .btn-submit:hover { background-color: #45a049; }
        .btn-reset:hover { background-color: #da190b; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>THÔNG TIN CÁ NHÂN</h2>
        <form action="#" method="POST">
            <!-- Họ và tên -->
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- CheckBox Sở thích -->
            <div class="form-group">
                <label>Sở thích:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="hobby" value="the_thao"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="am_nhac"> Âm nhạc</label>
                    <label><input type="checkbox" name="hobby" value="doc_sach"> Đọc sách</label>
                </div>
            </div>

            <!-- Nút Gửi & Nhập lại -->
            <div class="btn-group">
                <input type="submit" class="btn-submit" value="Gửi thông tin">
                <input type="reset" class="btn-reset" value="Nhập lại">
            </div>
        </form>
    </div>

</body>
</html>
