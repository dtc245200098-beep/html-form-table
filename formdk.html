<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Người Dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px 20px;
        }
        .form-card {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-card h2 {
            text-align: center;
            color: #333333;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444444;
        }
        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            padding-top: 5px;
        }
        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>ĐĂNG KÝ NGƯỜI DÙNG</h2>

        <!-- Form đăng ký với method POST và action đúng địa chỉ yêu cầu -->
        <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
            
            <!-- Trường Họ và tên: name="name" -->
            <div class="form-group">
                <label for="name">Họ và tên:</label>
                <input type="text" id="name" name="name" placeholder="Nhập họ và tên" required>
            </div>

            <!-- Trường Email: name="email" -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <!-- Trường Số điện thoại: name="phone" -->
            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
            </div>

            <!-- Trường Giới tính: name="gender" -->
            <div class="form-group">
                <label>Giới tính:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="nu"> Nữ</label>
                    <label><input type="radio" name="gender" value="khac"> Khác</label>
                </div>
            </div>

            <!-- Nút gửi dữ liệu -->
            <button type="submit" class="btn-submit">Đăng ký</button>

        </form>
    </div>

</body>
</html>
